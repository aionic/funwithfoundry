version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /src/ingest_func
      - /src/foundry_native_agent
      - /src/hello_world
      - /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
