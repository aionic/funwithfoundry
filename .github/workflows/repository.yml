name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Cloud-free checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      FWF_PYTHON: ${{ runner.temp }}/fwf-native/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
      FWF_INGEST_PYTHON: ${{ runner.temp }}/fwf-ingestion/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
      FWF_HELLO_PYTHON: ${{ runner.temp }}/fwf-hello/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
      FWF_DOCS_PYTHON: ${{ runner.temp }}/fwf-docs/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: native-python
        with:
          python-version: '3.13.7'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: ingestion-python
        with:
          python-version: '3.11.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.8.13'
          enable-cache: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: runner.os == 'Windows'
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'Windows'
        with:
          node-version: '22.16.0'
      - name: Install separate runtime environments
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv venv --python '${{ steps.native-python.outputs.python-path }}' "$env:RUNNER_TEMP/fwf-native"
          uv venv --python '${{ steps.ingestion-python.outputs.python-path }}' "$env:RUNNER_TEMP/fwf-ingestion"
          uv venv --python '${{ steps.native-python.outputs.python-path }}' "$env:RUNNER_TEMP/fwf-hello"
          uv pip sync --python $env:FWF_PYTHON --require-hashes src/foundry_native_agent/requirements.lock
          uv pip sync --python $env:FWF_INGEST_PYTHON --require-hashes src/ingest_func/requirements.lock
          uv pip sync --python $env:FWF_HELLO_PYTHON --require-hashes src/hello_world/requirements.lock
          uv pip check --python $env:FWF_PYTHON
          uv pip check --python $env:FWF_INGEST_PYTHON
          uv pip check --python $env:FWF_HELLO_PYTHON
          & $env:FWF_PYTHON -c "from langchain_azure_ai.agents.hosting import ResponsesHostServer; from langchain_azure_ai.tools import AzureAIProjectToolbox"
          & $env:FWF_HELLO_PYTHON -c "import azure.identity, httpx"
          & $env:FWF_HELLO_PYTHON src/hello_world/ask_agent.py --help
      - name: Install Python documentation tools
        if: runner.os == 'Windows'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv venv --python '${{ steps.native-python.outputs.python-path }}' "$env:RUNNER_TEMP/fwf-docs"
          uv pip install --python $env:FWF_DOCS_PYTHON -r .github/requirements.txt
          uv pip check --python $env:FWF_DOCS_PYTHON
      - name: Install locked documentation tools
        if: runner.os == 'Windows'
        working-directory: .github
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Documentation tool installation failed.' }
      - name: Run the release checks
        if: runner.os == 'Windows'
        run: ./scripts/Test-Repository.ps1 -Terraform -Release
      - name: Run Linux runtime checks
        if: runner.os == 'Linux'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/Test-Repository.ps1 -Quick
          & $env:FWF_INGEST_PYTHON .github/scripts/run-python-checks.py ingestion --release
          & $env:FWF_PYTHON .github/scripts/run-python-checks.py retrieval --release
          & $env:FWF_PYTHON .github/scripts/run-python-checks.py knowledge_schema --release

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.24.2'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
